<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Condições de idade</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
}

input {
    padding: 8px;
    font-size: 16px;
    width: 120px;
}

button {
    padding: 8px 15px;
    font-size: 16px;
    margin-left: 10px;
    cursor: pointer;
}

#resultado {
    margin-top: 20px;
    font-weight: bold;
    font-size: 18px;
}
</style>

</head>
<body>

<h1>Verificação de Idade</h1>

<input type="number" id="idade" placeholder="Idade">

<button onclick="verificar()">
Verificar
</button>

<p id="resultado"></p>

<script>
function verificar() {

    let idade = document.getElementById("idade").value;
    idade = Number(idade);

    let resultado = document.getElementById("resultado");

    if (idade === 0 && document.getElementById("idade").value === "") {
        resultado.innerHTML = "Por favor insere uma idade válida.";
        resultado.style.color = "black";
    }
    else if (idade < 0) {
        resultado.innerHTML = "Idade inválida.";
        resultado.style.color = "orange";
    }
    else if (idade < 18) {
        resultado.innerHTML = "És menor de idade.";
        resultado.style.color = "red";
    }
    else if (idade === 18) {
        resultado.innerHTML = "Tens exatamente 18 anos!";
        resultado.style.color = "blue";
    }
    else {
        resultado.innerHTML = "És maior de idade.";
        resultado.style.color = "green";
    }

}
</script>

</body>
</html>
