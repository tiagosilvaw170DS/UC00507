<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        .container {
            display: flex;
            flex-direction: column; /* Mobile-first: coluna por padrão */
            gap: 20px;
        }

        .caixa {
            background-color: lightgray;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        /* 💻 Computador: telas maiores que 768px → linha */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }

            .caixa {
                flex: 1; /* Todas as caixas têm o mesmo tamanho na linha */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="caixa">Caixa do Tiago</div>
        <div class="caixa">Caixa do Luis</div>
        <div class="caixa">Caixa do Pablo</div>
    </div>

</body>
</html>

</body>
</html>
